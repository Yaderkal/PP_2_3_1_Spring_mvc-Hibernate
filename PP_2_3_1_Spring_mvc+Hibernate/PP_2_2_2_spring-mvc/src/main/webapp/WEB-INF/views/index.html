<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: all 0.3s;
            margin: 10px;
        }
        .btn:hover {
            background: #5566d6;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #28a745;
        }
        .btn-secondary:hover {
            background: #218838;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .feature {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            flex: 1;
        }
        .feature h3 {
            color: #667eea;
            margin-bottom: 5px;
        }
        .feature p {
            color: #666;
            font-size: 14px;
        }
        .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .container { padding: 30px; }
            .features { flex-direction: column; }
            .btn { display: block; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Spring MVC App</h1>
    <p class="subtitle">CRUDы</p>

    <div>
        <a href="/users" class="btn">Посмотреть</a>
        <a href="/users/new" class="btn btn-secondary">Создать</a>
    </div>

    <div class="features">
        <div class="feature">
            <h3>Если</h3>
            <p>Вы видите </p>
        </div>
        <div class="feature">
            <h3>Эту</h3>
            <p>Надпись, значит что-то</p>
        </div>
        <div class="feature">
            <h3>что-то</h3>
            <p>пошло не так</p>
        </div>
    </div>
</div>
</body>
</html>
