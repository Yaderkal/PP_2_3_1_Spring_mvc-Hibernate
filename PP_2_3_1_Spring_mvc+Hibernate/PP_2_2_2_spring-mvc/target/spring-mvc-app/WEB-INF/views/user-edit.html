<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background: #5566d6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .readonly {
            background: #e9ecef;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✏️ Edit User</h1>

    <!-- ✅ Используем ${user.xxx} вместо *{xxx} -->
    <form th:action="@{/users/{id}(id=${user.id})}" method="post">
        <input type="hidden" name="_method" value="put">

        <div class="form-group">
            <label for="id">ID:</label>
            <input type="text" id="id" th:value="${user.id}" class="readonly" readonly/>
        </div>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:value="${user.name}" name="name" placeholder="Enter name"/>
        </div>

        <div class="form-group">
            <label for="middleName">Middle Name:</label>
            <input type="text" id="middleName" th:value="${user.middleName}" name="middleName" placeholder="Enter middle name"/>
        </div>

        <div class="form-group">
            <label for="surName">Sur Name:</label>
            <input type="text" id="surName" th:value="${user.surName}" name="surName" placeholder="Enter sur name"/>
        </div>

        <div class="form-group">
            <label for="mail">Email:</label>
            <input type="email" id="mail" th:value="${user.mail}" name="mail" placeholder="Enter email"/>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">💾 Update</button>
            <a href="/users" class="btn btn-secondary">↩️ Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
